<body>

    <!-- HEADER -->
    <div class="header">

        <h1>
            Student Credential Sharing Tool
        </h1>

        <p>
            Krishna Vikash Techno School
        </p>

                <option value="">
                    All Classes
                </option>

                Clear All

            </button>

<script>

/* =====================================================
   SETTINGS
===================================================== */

const VIDEO_URL =
    "https://purvikayadav.github.io/student-credential-tool/CoForce-Student-Login-Guide-Hindi.mp4";


/* =====================================================
   GLOBAL DATA
===================================================== */

let students = [];


/* =====================================================
   VIDEO
===================================================== */

function initializeVideo() {

    const video =
        document.getElementById("guideVideo");

    const source =
        document.getElementById("guideVideoSource");

    const openButton =
        document.getElementById("videoOpenBtn");

    if (source) {

        source.src = VIDEO_URL;

    }

    if (video) {

        video.load();

    }

    if (openButton) {

        openButton.href = VIDEO_URL;

    }

}


/* =====================================================
   NORMALIZE HEADER
===================================================== */

function normalizeHeader(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }

    return String(value)

        .trim()

        .toLowerCase()

        .replace(/\uFEFF/g, "")

        .replace(/[\/\\&().,:;#_-]+/g, " ")

        .replace(/\s+/g, " ")

        .trim();

}


/* =====================================================
   GET VALUE
===================================================== */

function getValue(object, possibleNames) {

    const keys =
        Object.keys(object);

    for (const name of possibleNames) {

        const normalizedWanted =
            normalizeHeader(name);

        for (const key of keys) {

            if (
                normalizeHeader(key) ===
                normalizedWanted
            ) {

                return object[key];

            }

        }

    }

    return "";

}


/* =====================================================
   STUDENT NORMALIZATION
===================================================== */

function normalizeStudent(object) {

    const name =
        getValue(object, [

            "Student Name",
            "Student Full Name",
            "Name",
            "Candidate Name",
            "Candidate",
            "Name of Candidate",
            "Name of Student",
            "Student"

        ]);


    const id =
        getValue(object, [

            "Student ID / User ID",
            "Student ID",
            "User ID",
            "Student/User ID",
            "UserID",
            "StudentID",
            "Admission No",
            "Admission Number",
            "Student Code",
            "Registration No",
            "Registration Number",
            "Roll No",
            "Roll Number"

        ]);


    const email =
        getValue(object, [

            "Email",
            "Email ID",
            "Email Address",
            "Username",
            "Login ID",
            "Login Username",
            "Email / Username"

        ]);


    const password1 =
        getValue(object, [

            "Password 1",
            "Password",
            "Password1",
            "Password One",
            "Pass",
            "Pass 1"

        ]);


    const password2 =
        getValue(object, [

            "Password 2",
            "Password2",
            "Password Two",
            "Pass 2"

        ]);


    const grade =
        getValue(object, [

            "Class",
            "Grade",
            "Class / Grade",
            "Class & Section",
            "Class Section",
            "Section"

        ]);


    return {

        name: String(name || "").trim(),

        id: String(id || "").trim(),

        email: String(email || "").trim(),

        password1:
            String(password1 || "").trim(),

        password2:
            String(password2 || "").trim(),

        grade:
            String(grade || "").trim()

    };

}


/* =====================================================
   CHECK STUDENT DATA
===================================================== */

function hasStudentData(student) {

    return (
        student.name ||
        student.id ||
        student.email
    );

}


/* =====================================================
   HEADER DETECTION
===================================================== */

function findHeaderRow(rows) {

    const maximum =
        Math.min(rows.length, 30);


    let bestRow = null;

    let bestScore = 0;


    for (let i = 0; i < maximum; i++) {

        const row = rows[i];

        if (!row ||
            row.length === 0) {

            continue;

        }


        let score = 0;


        for (const cell of row) {

            const h =
                normalizeHeader(cell);


            /*
             * EXACT USER HEADINGS
             */

            if (
                h === "student id user id"
            ) {

                score += 5;

            }

            else if (
                h === "student name"
            ) {

                score += 5;

            }

            else if (
                h === "email"
            ) {

                score += 5;

            }

            else if (
                h === "password 1"
            ) {

                score += 5;

            }

            else if (
                h === "password 2"
            ) {

                score += 5;

            }


            /*
             * OTHER COMMON HEADINGS
             */

            else if (
                h.includes("student id") ||
                h.includes("user id")
            ) {

                score += 3;

            }

            else if (
                h.includes("student name") ||
                h === "name"
            ) {

                score += 3;

            }

            else if (
                h.includes("email") ||
                h.includes("username")
            ) {

                score += 3;

            }

            else if (
                h.includes("password")
            ) {

                score += 3;

            }

        }


        if (score > bestScore) {

            bestScore = score;

            bestRow = {

                index: i,

                headers: row.map(function(cell) {

                    return String(
                        cell ?? ""
                    ).trim();

                })

            };

        }

    }


    /*
     * If at least two useful columns
     * are detected, accept the row.
     */

    if (
        bestRow &&
        bestScore >= 6
    ) {

        return bestRow;

    }


    return null;

}


/* =====================================================
   SHOW DIAGNOSTIC
===================================================== */

function showDiagnostic(message) {

    const box =
        document.getElementById("diagnostic");

    const text =
        document.getElementById("diagnosticText");

    if (box) {

        box.style.display = "block";

    }

    if (text) {

        text.textContent = message;

    }

}


/* =====================================================
   SHOW DETECTED COLUMNS
===================================================== */

function showDetectedHeaders(sheetName, headers) {

    const box =
        document.getElementById("diagnostic");

    const text =
        document.getElementById("diagnosticText");

    const columns =
        document.getElementById("detectedColumns");


    if (box) {

        box.style.display = "block";

    }


    if (text) {

        text.textContent =
            "Sheet: " + sheetName +
            " — The following headings were detected:";

    }


    if (columns) {

        columns.innerHTML = "";


        headers.forEach(function(header, index) {

            if (!header) return;


            const div =
                document.createElement("div");

            div.textContent =
                (index + 1) +
                ". " +
                header;

            columns.appendChild(div);

        });

    }

}


/* =====================================================
   PROCESS FILES
===================================================== */

async function processFiles(files) {

    let total = 0;


    for (const file of files) {

        try {

            const count =
                await processSingleFile(file);

            total += count;

        }

        catch (error) {

            console.error(
                "File error:",
                file.name,
                error
            );

            showDiagnostic(
                "Could not read file: " +
                file.name +
                ". Please make sure it is a valid CSV/XLS/XLSX file."
            );

        }

    }


    return total;

}


/* =====================================================
   PROCESS SINGLE FILE
===================================================== */

function processSingleFile(file) {

    return new Promise(function(resolve, reject) {

        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                try {

                    const data =
                        new Uint8Array(
                            event.target.result
                        );


                    const workbook =
                        XLSX.read(
                            data,
                            {
                                type: "array",
                                raw: false,
                                cellDates: true,
                                cellText: true
                            }
                        );


                    let count = 0;


                    workbook.SheetNames.forEach(
                        function(sheetName) {

                            const sheet =
                                workbook.Sheets[sheetName];


                            if (!sheet) {

                                return;

                            }


                            const rows =
                                XLSX.utils.sheet_to_json(
                                    sheet,
                                    {
                                        header: 1,
                                        defval: "",
                                        raw: false
                                    }
                                );


                            if (
                                !rows ||
                                rows.length === 0
                            ) {

                                return;

                            }


                            const headerInfo =
                                findHeaderRow(rows);


                            if (!headerInfo) {

                                showDiagnostic(
                                    "The file was opened successfully, but the student columns could not be identified."
                                );

                                return;

                            }


                            showDetectedHeaders(
                                sheetName,
                                headerInfo.headers
                            );


                            /*
                             * Read student rows
                             */

                            for (
                                let i =
                                    headerInfo.index + 1;

                                i < rows.length;

                                i++
                            ) {

                                const row =
                                    rows[i];


                                if (
                                    !row ||
                                    row.length === 0
                                ) {

                                    continue;

                                }


                                const object = {};


                                headerInfo.headers.forEach(
                                    function(
                                        column,
                                        index
                                    ) {

                                        if (column) {

                                            object[column] =
                                                row[index] ??
                                                "";

                                        }

                                    }
                                );


                                const student =
                                    normalizeStudent(
                                        object
                                    );


                                if (
                                    hasStudentData(
                                        student
                                    )
                                ) {

                                    students.push(
                                        student
                                    );

                                    count++;

                                }

                            }

                        }
                    );


                    resolve(count);

                }

                catch (error) {

                    reject(error);

                }

            };


        reader.onerror =
            function() {

                reject(
                    new Error(
                        "Browser could not read the file."
                    )
                );

            };


        reader.readAsArrayBuffer(file);

    });

}


/* =====================================================
   FILE SELECT BUTTON
===================================================== */

const selectButton =
    document.getElementById(
        "selectFilesButton"
    );


const fileInput =
    document.getElementById(
        "fileInput"
    );


selectButton.addEventListener(
    "click",
    function() {

        fileInput.click();

    }
);


/* =====================================================
   FILE CHANGE
===================================================== */

fileInput.addEventListener(
    "change",
    async function() {

        const files =
            Array.from(
                fileInput.files || []
            );


        if (files.length === 0) {

            return;

        }


        const status =
            document.getElementById(
                "status"
            );


        status.textContent =
            "⏳ Reading file...";


        /*
         * Important:
         * Do not reject the file based on
         * Android MIME type or filename.
         */

        try {

            const count =
                await processFiles(files);


            if (count > 0) {

                status.textContent =
                    "✅ " +
                    count +
                    " student record(s) imported successfully.";


                renderStudents();

                updateGradeFilter();

            }

            else {

                status.textContent =
                    "⚠ File opened successfully, but no student records were found.";

                showDiagnostic(
                    "The file was opened successfully, but the student columns could not be identified. Please check the detected columns shown below."
                );

            }

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "❌ Error reading the file.";

            showDiagnostic(
                error.message ||
                "Unknown file reading error."
            );

        }


        /*
         * Allows the same file to be selected again.
         */

        fileInput.value = "";

    }
);


/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "searchBox"
).addEventListener(
    "input",
    renderStudents
);


/* =====================================================
   GRADE FILTER
===================================================== */

document.getElementById(
    "gradeFilter"
).addEventListener(
    "change",
    renderStudents
);


/* =====================================================
   UPDATE GRADE FILTER
===================================================== */

function updateGradeFilter() {

    const select =
        document.getElementById(
            "gradeFilter"
        );


    const grades =
        [...new Set(

            students

                .map(function(student) {

                    return student.grade;

                })

                .filter(Boolean)

        )];


    select.innerHTML =
        '<option value="">All Classes</option>';


    grades.sort().forEach(
        function(grade) {

            const option =
                document.createElement(
                    "option"
                );

            option.value = grade;

            option.textContent = grade;

            select.appendChild(option);

        }
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function makeMessage(student) {

    return `Dear Parent,

Please find below the login credentials for ${student.name || "your ward"}.

Student Name: ${student.name || "-"}

Student ID / User ID: ${student.id || "-"}

Email / Username: ${student.email || "-"}

Password 1: ${student.password1 || "-"}

Password 2: ${student.password2 || "-"}

CoForce Website:
https://www.coforce.in/

Hindi Video Login Guide:
${VIDEO_URL}

Kindly use the above credentials to access the CoForce platform.

Please watch the Hindi video guide for the login process.

Please keep these credentials confidential and do not share them with others.

Regards,

School Administration`;

}


/* =====================================================
   RENDER STUDENTS
===================================================== */

function renderStudents() {

    const container =
        document.getElementById(
            "studentContainer"
        );


    const search =
        document.getElementById(
            "searchBox"
        ).value
        .toLowerCase()
        .trim();


    const grade =
        document.getElementById(
            "gradeFilter"
        ).value;


    const filtered =
        students.filter(
            function(student) {

                const searchText =
                    (
                        student.name +
                        " " +
                        student.id +
                        " " +
                        student.email
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    searchText.includes(search);


                const matchesGrade =
                    !grade ||
                    student.grade === grade;


                return (
                    matchesSearch &&
                    matchesGrade
                );

            }
        );


    if (filtered.length === 0) {

        container.innerHTML =
            '<div class="empty">No student records found.</div>';

        return;

    }


    const grid =
        document.createElement(
            "div"
        );

    grid.className =
        "student-grid";


    filtered.forEach(
        function(student, index) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "student-card";


            card.innerHTML = `

                <h3>
                    ${escapeHTML(
                        student.name ||
                        "Student"
                    )}
                </h3>

                ${
                    student.grade
                    ? `
                    <div class="credential">
                        <strong>Class / Grade</strong>
                        ${escapeHTML(student.grade)}
                    </div>
                    `
                    : ""
                }

                <div class="credential">
                    <strong>Student ID / User ID</strong>
                    ${escapeHTML(student.id || "-")}
                </div>

                <div class="credential">
                    <strong>Email / Username</strong>
                    ${escapeHTML(student.email || "-")}
                </div>

                <div class="credential">
                    <strong>Password 1</strong>
                    ${escapeHTML(student.password1 || "-")}
                </div>

                <div class="credential">
                    <strong>Password 2</strong>
                    ${escapeHTML(student.password2 || "-")}
                </div>

                <div class="buttons">

                    <button
                        class="copy"
                        onclick="copyCredentials(${index})">

                        📋 Copy

                    </button>

                    <button
                        class="share"
                        onclick="shareCredentials(${index})">

                        📤 Share

                    </button>

                    <button
                        class="whatsapp"
                        onclick="whatsappCredentials(${index})">

                        WhatsApp

                    </button>

                    <button
                        class="print"
                        onclick="printCredentials(${index})">

                        🖨 Print

                    </button>

                </div>
            `;


            /*
             * Store actual student reference
             */

            card.dataset.studentIndex =
                students.indexOf(student);


            grid.appendChild(card);

        }
    );


    container.innerHTML = "";

    container.appendChild(grid);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   GET STUDENT FROM FILTERED CARD INDEX
===================================================== */

function getStudentByFilteredIndex(index) {

    const search =
        document.getElementById(
            "searchBox"
        ).value
        .toLowerCase()
        .trim();


    const grade =
        document.getElementById(
            "gradeFilter"
        ).value;


    const filtered =
        students.filter(
            function(student) {

                const searchText =
                    (
                        student.name +
                        " " +
                        student.id +
                        " " +
                        student.email
                    ).toLowerCase();


                return (
                    (!search ||
                        searchText.includes(search)) &&

                    (!grade ||
                        student.grade === grade)
                );

            }
        );


    return filtered[index];

}


/* =====================================================
   COPY
===================================================== */

async function copyCredentials(index) {

    const student =
        getStudentByFilteredIndex(index);


    if (!student) return;


    const message =
        makeMessage(student);


    try {

        await navigator.clipboard.writeText(
            message
        );

        alert(
            "Credentials copied successfully."
        );

    }

    catch (error) {

        alert(
            "Could not copy automatically. Please use Share."
        );

    }

}


/* =====================================================
   SHARE
===================================================== */

async function shareCredentials(index) {

    const student =
        getStudentByFilteredIndex(index);


    if (!student) return;


    const message =
        makeMessage(student);


    if (
        navigator.share
    ) {

        try {

            await navigator.share({

                title:
                    "Student Login Credentials",

                text:
                    message

            });

        }

        catch (error) {

            console.log(
                "Share cancelled."
            );

        }

    }

    else {

        await navigator.clipboard.writeText(
            message
        );

        alert(
            "Sharing is not supported. Message copied instead."
        );

    }

}


/* =====================================================
   WHATSAPP
===================================================== */

function whatsappCredentials(index) {

    const student =
        getStudentByFilteredIndex(index);


    if (!student) return;


    const message =
        makeMessage(student);


    const url =
        "https://wa.me/?text=" +
        encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );

}
